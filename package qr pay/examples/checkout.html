<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanh toán QR</title>
<style>body{font:17px system-ui;background:#f6f5f1;color:#21231e;margin:0;padding:24px}main{max-width:420px;margin:24px auto}img{width:100%;height:auto}dt{margin-top:16px;color:#666}dd{margin:4px 0;overflow-wrap:anywhere}button{font:inherit;padding:12px 18px;cursor:pointer}#status{font-weight:600;color:#1b7046}#status[data-state="expired"]{color:#9f4927}#code{font:700 24px monospace}</style>
<main><h1 id="title">Quét mã để thanh toán</h1><p id="status" role="status" aria-live="polite">Đang tải đơn…</p>
<img id="qr" alt="Mã QR chuyển khoản" hidden><dl><dt>Số tiền</dt><dd id="amount"></dd>
<dt>Tài khoản nhận</dt><dd id="account"></dd><dt>Nội dung chuyển khoản</dt><dd id="code"></dd></dl>
<button id="copy" disabled>Sao chép nội dung</button><p id="note">Giữ nguyên số tiền và nội dung để xác nhận tự động.</p></main>
<script type="module">
// Serve this page from your project origin. Your backend creates the order and
// redirects here with #id=ORDER_ID&token=STATUS_TOKEN. Fragment is not sent to servers.
const params = new URLSearchParams(location.hash.slice(1));
const id = params.get('id'), token = params.get('token');
const status = document.querySelector('#status');
const copy = document.querySelector('#copy');
let timer, disposed = false;
copy.onclick = async () => { try { await navigator.clipboard.writeText(document.querySelector('#code').textContent); copy.textContent = 'Đã sao chép'; } catch { copy.textContent = 'Hãy chọn và sao chép mã ở trên'; } };
async function poll() {
  try {
    if (!id || !token) throw new Error('Thiếu thông tin đơn thanh toán.');
    const response = await fetch(`/api/payments/orders/${encodeURIComponent(id)}`, { headers: { Authorization: `Bearer ${token}` }, cache: 'no-store', signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('Chưa tải được đơn. Hãy kiểm tra lại đường dẫn.');
    const order = await response.json();
    document.querySelector('#qr').src = order.qrUrl; document.querySelector('#qr').hidden = false;
    document.querySelector('#amount').textContent = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(order.amount);
    document.querySelector('#account').textContent = `${order.bank.name} · ${order.bank.account}`;
    document.querySelector('#code').textContent = order.code; copy.disabled = false;
    status.textContent = { pending: 'Đang chờ thanh toán', paid: 'Đã nhận thanh toán', expired: 'Đơn đã hết hạn. Hãy tạo đơn mới.' }[order.status];
    status.dataset.state = order.status;
    document.querySelector('#title').textContent = {pending:'Quét mã để thanh toán',paid:'Thanh toán thành công',expired:'Đơn đã hết hạn'}[order.status];
    if (order.status !== 'pending') { copy.disabled = true; document.querySelector('#qr').hidden = true; document.querySelector('#note').textContent = order.status === 'paid' ? 'Thanh toán đã được ghi nhận. Bạn có thể quay lại trang mua hàng.' : 'Không chuyển tiền theo mã đã hết hạn.'; return; }
  } catch (error) { status.textContent = error.message; if (!id || !token) return; }
  if (!disposed) timer = setTimeout(poll, 3000);
}
window.addEventListener('pagehide', () => { disposed = true; clearTimeout(timer); });
window.addEventListener('hashchange', () => location.reload());
poll();
</script></html>
