plugins { id 'com.android.application' }
android {
    namespace 'studio.windi.soundbooki'
    compileSdk 36
    defaultConfig {
        applicationId 'windi.soundbooki'
        minSdk 33
        targetSdk 36
        versionCode 10
        versionName '0.2.7'
        manifestPlaceholders = [appLabel: 'Soundbooki']
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        localPreview {
            storeFile file('../.tooling/preview.keystore')
            storePassword 'android'
            keyAlias 'soundbooki-preview'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.localPreview; versionNameSuffix '-test'; manifestPlaceholders = [appLabel: 'Soundbooki Test'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    ndkVersion '27.1.12297006'
    androidResources { noCompress += ['onnx','bin','wav','mp3','otf','ttf'] }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
}
